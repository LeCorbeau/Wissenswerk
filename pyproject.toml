[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wissenswerk"
version = "0.2.0"
description = "A platform-independent corpus-to-wiki knowledge compiler."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [
  { name = "LeCorbeau" }
]
keywords = ["knowledge-base", "wiki", "rag", "agents", "markdown", "pgvector"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Documentation",
  "Topic :: Text Processing"
]
dependencies = []

[project.optional-dependencies]
dev = ["ruff>=0.6", "mypy>=1.10"]

[project.scripts]
wissenswerk = "wissenswerk:main"

[tool.setuptools]
py-modules = ["wissenswerk"]

[tool.ruff]
target-version = "py312"
line-length = 160

[tool.ruff.lint]
select = ["E9", "F", "B", "UP", "SIM"]
# UP017: the public module namespace keeps `timezone` (tests and callers use `wissenswerk.timezone`).
ignore = ["UP017"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
