name: Bug report
description: Report a reproducible Wissenswerk defect.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What failed, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Commands, fixture paths, and minimal input needed to reproduce.
      placeholder: |
        ./wissenswerk.py doctor --json
        ./wissenswerk.py test --json
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, provider/vector-store configuration, and relevant commit.
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Paste sanitized JSON output. Do not include secrets or private corpus text.
      render: shell
    validations:
      required: false
