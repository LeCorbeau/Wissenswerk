name: Wissenswerk CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Syntax check
        run: python -m py_compile wissenswerk.py

      - name: Install lint tooling
        run: python -m pip install ruff mypy

      - name: Lint (ruff)
        run: ruff check wissenswerk.py

      - name: Type check (mypy, advisory)
        # Known payload-typing findings are still being worked down; report them without failing the build.
        continue-on-error: true
        run: mypy wissenswerk.py

      - name: Validate JSON contracts
        # wissenswerk.yaml is intentionally JSON-compatible YAML (stdlib-only parsing).
        run: |
          python -m json.tool wissenswerk.yaml >/dev/null
          python -m json.tool project_manifest.json >/dev/null

      - name: Run standalone tests
        run: ./wissenswerk.py test --json

      - name: Run doctor
        run: ./wissenswerk.py doctor --json

      - name: Run audit
        run: ./wissenswerk.py audit --json

      - name: Run stats
        run: ./wissenswerk.py stats --json

      - name: Run design lint
        run: ./wissenswerk.py design lint --json

      - name: Check report hygiene
        run: ./wissenswerk.py hygiene reports --json

      - name: Check diff hygiene
        run: git diff --check
